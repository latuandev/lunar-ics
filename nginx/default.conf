upstream lunar_app {
    server app:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    charset utf-8;
    client_max_body_size 1m;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css text/csv text/calendar application/javascript;

    location /healthz {
        proxy_pass http://lunar_app/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://lunar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /calendar/ {
        proxy_pass http://lunar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /downloads/ {
        proxy_pass http://lunar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"Route not found"}}';
    }
}

